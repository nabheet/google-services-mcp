name: Publish to npm

# Single publishing workflow — matches the ONE trusted publisher configured
# on npm (workflow filename = publish.yml). Handles both channels:
#   - push to main       -> publish next patch to `latest`, then create
#                           vX.Y.Z tag + GitHub release (auto-release on merge)
#   - tag  v*-beta*      -> publish to `beta`   (prerelease + GitHub release)
#   - manual dispatch    -> publish next -beta.X prerelease (no git change) to
#                           `beta` (staging build from main).
#                           Next beta is derived from the last published beta
#                           so repeated runs don't collide with a published
#                           version.
#
# Stable version comes from the npm registry (last published `latest` + patch),
# not from a possibly-stale package.json, so repeated merges never collide.
# An intentional minor/major bump in package.json is honored: if the working
# tree version is ahead of the registry, it is published as-is.
#
# The vX.Y.Z tag pushed here does NOT re-trigger this workflow (only v*-beta*
# tags do), so no publish loop.
#
# npm trusted publishing (OIDC) auto-generates provenance — no token needed.
#
# Concurrency: publishes are serialized so two rapid merges can't race the
# same next-version. Retry: 3 attempts, transient failures only — a version
# conflict (version already published) is NEVER retried.

on:
  push:
    branches: [main]
    tags: ["v*-beta*"]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # trusted publishing (OIDC)
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org/
      - run: npm ci
        timeout-minutes: 2
      - run: npm test
        timeout-minutes: 2
      - run: npm run build
        timeout-minutes: 2
      - name: Determine channel (latest / beta / staging)
        id: channel
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "tag=beta" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            # merge to main -> next patch after the last published `latest`
            LAST=$(npm view google-services-mcp@latest version 2>/dev/null || true)
            CUR=$(npm pkg get version | tr -d '"')
            if [ -n "$LAST" ] && [ "$(printf '%s\n%s' "$CUR" "$LAST" | sort -V | tail -1)" = "$LAST" ]; then
              # tree at/below registry -> align to registry (unless equal),
              # then bump patch; npm errors on "Version not changed" if the
              # align target equals the current version
              if [ "$CUR" != "$LAST" ]; then
                npm version "$LAST" --no-git-tag-version --no-commit-hooks
              fi
              npm version patch --no-git-tag-version --no-commit-hooks
            else
              # tree version ahead (intentional minor/major bump) -> as-is
              :
            fi
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            # manual dispatch -> next staging beta, derived from the last
            # published beta (working tree is unchanged between runs)
            CUR=$(npm pkg get version | tr -d '"')
            LAST_BETA=$(npm view google-services-mcp@beta version 2>/dev/null || true)
            if [ -n "$LAST_BETA" ]; then
              LAST_BASE="${LAST_BETA%-beta.*}"
              NEXT_BASE=$(printf '%s\n' "$CUR" "$LAST_BASE" | sort -V | tail -1)
              if [ "$NEXT_BASE" = "$LAST_BASE" ] && [ "$NEXT_BASE" != "$CUR" ]; then
                N="${LAST_BETA##*-beta.}"
                npm version "${NEXT_BASE}-beta.$((N + 1))" --no-git-tag-version --no-commit-hooks
              else
                npm version prerelease --preid=beta --no-git-tag-version --no-commit-hooks
              fi
            else
              npm version prerelease --preid=beta --no-git-tag-version --no-commit-hooks
            fi
            echo "tag=beta" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Show publishing target
        run: 'echo "Publishing $(npm pkg get version) to tag ${{ steps.channel.outputs.tag }}"'
      - name: Publish (retry transient only)
        timeout-minutes: 5
        run: |
          for i in $(seq 1 3); do
            OUT=$(npm publish --tag ${{ steps.channel.outputs.tag }} --provenance --access public 2>&1) && { echo "$OUT"; exit 0; }
            if echo "$OUT" | grep -qE "cannot publish over|previously published"; then
              echo "$OUT" >&2
              echo "Version conflict — not retrying" >&2
              exit 1
            fi
            echo "$OUT"
            echo "Publish failed (transient?), retrying ($i/3)..."
            sleep 3
          done
          exit 1
      - name: Push tag (stable only)
        id: tag
        if: steps.channel.outputs.tag == 'latest'
        run: |
          V=$(npm pkg get version | tr -d '"')
          echo "published=$V" >> "$GITHUB_OUTPUT"
          git tag "v$V"
          git push origin "v$V"
      - uses: softprops/action-gh-release@v2
        if: steps.channel.outputs.tag == 'latest'
        with:
          tag_name: v${{ steps.tag.outputs.published }}
          generate_release_notes: true
      - uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: true
